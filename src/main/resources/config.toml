# ============================================================
#  Velocity Performance Test - 設定檔
#  修改後重啟 Proxy 或執行 /vperf reload 生效。
# ============================================================

[network]

# 下載測試要抓取的資料量（MiB），為所有並行連線的合計。
# 測試會在達到此量或超過 transfer-budget-seconds 時停止。
download-mib = 50

# 上傳測試要送出的資料量（MiB），為所有並行連線的合計。設為 0 可停用上傳測試。
upload-mib = 25

# 上傳端點。留空字串可停用上傳測試。
upload-url = "https://speed.cloudflare.com/__up"

# 延遲取樣次數，用於計算平均延遲與抖動（jitter）。
# 實際會多跑一次暖機請求（含 TCP/TLS/HTTP2 握手）並丟棄，不計入這裡的次數。
ping-samples = 5

# 下載 / 上傳各開幾條並行連線。單條 TCP 的吞吐受 BDP（頻寬 × 延遲）壓制，
# 跨國線路上通常卡在兩三百 Mbps——那是 TCP 的上限，不是你線路的上限。
# 傳輸一律走 HTTP/1.1，這樣每條串流才會各佔一條 TCP；HTTP/2 會把它們多工在
# 同一條連線上，開再多也沒用。1 = 單連線。上限 16，再多只是彼此爭搶頻寬。
parallel-streams = 4

# 開頭多久內的資料不計入速率（毫秒），用來排除 TCP 慢啟動的爬升期。
# 實際套用值會取此設定與「傳輸總時長 ÷ 3」的較小者，短測試才不會沒東西可算。
# 設為 0 可停用（等於回到整段平均）。
warmup-millis = 1000

# 連線 / 單一請求 / 單次傳輸的時間上限（秒）。
connect-timeout-seconds = 5
request-timeout-seconds = 30
transfer-budget-seconds = 20

# 測速結果的快取時間（秒）。此期間內重複執行 /vperf network 會直接回傳上次結果，
# 避免重複消耗頻寬。
result-cache-seconds = 60

# 每位使用者兩次指令之間的最短間隔（秒）。
command-cooldown-seconds = 10

# 對外 IP 查詢服務，依序嘗試直到成功。
public-ip-services = [
    "https://api.ipify.org",
    "https://icanhazip.com",
    "https://ifconfig.me/ip",
]

# ------------------------------------------------------------
# 下載測速節點。啟動測試時會平行量測所有節點的延遲，並依延遲由低到高
# 依序嘗試，直到有一個成功為止。
#
# URL 中的 {bytes} 會被替換成實際要求的位元組數（僅部分端點支援）。
#
# 節點若回傳 text/* 或遠少於要求的資料量，會被判定為失效並自動跳過——
# 這類「HTTP 200 但內容是錯誤頁」的失效節點相當常見。
# ------------------------------------------------------------

# Cloudflare 支援指定下載位元組數，是最精確也最穩定的選擇，建議保留在第一位。
[[network.download-targets]]
name = "Cloudflare"
url = "https://speed.cloudflare.com/__down?bytes={bytes}"

[[network.download-targets]]
name = "Hetzner (Ashburn, US)"
url = "https://ash-speed.hetzner.com/100MB.bin"

[[network.download-targets]]
name = "Hetzner (Falkenstein, DE)"
url = "https://fsn1-speed.hetzner.com/100MB.bin"

[[network.download-targets]]
name = "Hetzner (Helsinki, FI)"
url = "https://hel1-speed.hetzner.com/100MB.bin"

[[network.download-targets]]
name = "Tele2 (Stockholm, SE)"
url = "http://speedtest.tele2.net/100MB.zip"
